[project]
name = "softmax-fix"
version = "0.1.0"
description = "Numerical property tests for softmax and cross-entropy in PyTorch and JAX"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "hypothesis==6.136.7",
    "jax==0.12.0.1",
    "pytest==8.4.1",
    "torch==2.7.1",
]

[tool.uv]
package = false

# These experiments run on CPU. macOS uses the regular PyPI torch wheel.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["test_pytorch.py", "test_jax.py"]
